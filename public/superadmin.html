<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Control Center</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f1f5f9; color: #0f172a; padding-bottom: 40px; }
    header { background: #1e1b4b; color: #fff; padding: 20px 15px; text-align: center; }
    header h1 { font-size: 1.2rem; margin-bottom: 4px; }
    .container { max-width: 550px; margin: 20px auto; padding: 0 12px; }
    .card { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .card h2 { font-size: 0.95rem; margin-bottom: 12px; color: #1e1b4b; display: flex; align-items: center; justify-content: space-between; }
    .input-field { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; outline: none; }
    .vendor-item { padding: 12px 0; border-bottom: 1px solid #e2e8f0; }
    .vendor-header { display: flex; justify-content: space-between; align-items: center; }
    .vendor-name { font-size: 0.9rem; font-weight: 700; color: #0f172a; }
    .vendor-sub { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
    .badge { display: inline-block; padding: 2px 8px; font-size: 0.65rem; font-weight: 700; border-radius: 12px; text-transform: uppercase; }
    .badge-active { background: #dcfce7; color: #15803d; }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-deactivated { background: #fee2e2; color: #b91c1c; }
    .btn-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .btn { padding: 5px 10px; font-size: 0.7rem; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; color: white; }
    .btn-approve { background: #10b981; }
    .btn-suspend { background: #f59e0b; }
    .btn-delete { background: #ef4444; }
    .btn-extend { background: #3b82f6; }
    .btn-reset { background: #6366f1; }
    .save-btn { background: #4f46e5; color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1><i class="fa-solid fa-user-shield"></i> SaaS Super Admin Dashboard</h1>
  </header>
  <div class="container">
    <div class="card">
      <h2><span><i class="fa-solid fa-qrcode"></i> Super Admin Payment Details</span></h2>
      <label style="font-size:0.75rem; color:#64748b; font-weight:600;">UPI ID:</label>
      <input type="text" id="adminUpi" class="input-field" placeholder="yourupi@upi">
      <label style="font-size:0.75rem; color:#64748b; font-weight:600;">WhatsApp Number:</label>
      <input type="text" id="adminWhatsapp" class="input-field" placeholder="919876543210">
      <button class="save-btn" onclick="saveAdminSettings()">Save Settings</button>
    </div>
    <div class="card">
      <h2>
        <span><i class="fa-solid fa-store"></i> Registered Vendors</span>
        <a href="/register.html" style="font-size:0.75rem; color:#2563eb; text-decoration:none;" target="_blank">+ Add Vendor</a>
      </h2>
      <div id="vendor-list">Loading vendors...</div>
    </div>
  </div>
  <script>
    async function loadAdminData() {
      const setRes = await fetch('/api/admin/settings');
      const settings = await setRes.json();
      document.getElementById('adminUpi').value = settings.upiId || '';
      document.getElementById('adminWhatsapp').value = settings.adminWhatsapp || '';

      const res = await fetch('/api/admin/vendors');
      const vendors = await res.json();
      const list = document.getElementById('vendor-list');
      list.innerHTML = '';
      if(!vendors || vendors.length === 0) { list.innerHTML = '<p style="font-size:0.8rem; color:#64748b;">No vendors found.</p>'; return; }

      vendors.forEach(v => {
        const expiry = new Date(v.expiryDate).toLocaleDateString();
        let badgeClass = v.status === 'active' ? 'badge-active' : (v.status === 'pending' ? 'badge-pending' : 'badge-deactivated');
        list.innerHTML += `
          <div class="vendor-item">
            <div class="vendor-header">
              <div class="vendor-name">${v.storeName} <span class="badge ${badgeClass}">${v.status}</span></div>
              <div>
                <a href="/admin.html?storeId=${v.id}" style="font-size:0.75rem; color:#2563eb; margin-right:6px;" target="_blank">Admin</a>
                <a href="/?store=${v.id}" style="font-size:0.75rem; color:#059669;" target="_blank">Store</a>
              </div>
            </div>
            <div class="vendor-sub">ID: ${v.id} | WA: ${v.whatsappNumber}</div>
            <div class="vendor-sub">Plan: ${v.planType || '1 Month'} | Expiry: <strong>${expiry}</strong></div>
            <div class="btn-row">
              ${v.status !== 'active' ? `<button class="btn btn-approve" onclick="updateVendor('${v.id}', 'active', null)">Approve</button>` : ''}
              ${v.status === 'active' ? `<button class="btn btn-suspend" onclick="updateVendor('${v.id}', 'suspended', null)">Suspend</button>` : ''}
              <button class="btn btn-extend" onclick="extendPlan('${v.id}')">+ Extend</button>
              <button class="btn btn-reset" onclick="resetPassword('${v.id}')">Reset Pass</button>
              <button class="btn btn-delete" onclick="deleteVendor('${v.id}')">Delete</button>
            </div>
          </div>
        `;
      });
    }
    async function saveAdminSettings() {
      const upiId = document.getElementById('adminUpi').value;
      const adminWhatsapp = document.getElementById('adminWhatsapp').value;
      await fetch('/api/admin/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ upiId, adminWhatsapp }) });
      alert("Settings Saved!");
    }
    async function updateVendor(storeId, status, extendMonths) {
      await fetch('/api/admin/vendor/update-status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ storeId, status, extendMonths }) });
      loadAdminData();
    }
    function extendPlan(storeId) {
      const months = prompt("Extend months? (1, 3, 12)", "1");
      if(months) updateVendor(storeId, null, months);
    }
    async function resetPassword(storeId) {
      const newPassword = prompt("Enter New Password for Vendor:");
      if(!newPassword) return;
      const res = await fetch('/api/admin/vendor/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ storeId, newPassword })
      });
      const data = await res.json();
      alert(data.message);
    }
    async function deleteVendor(storeId) {
      if(!confirm("Delete store permanently?")) return;
      await fetch(`/api/admin/vendor/${storeId}`, { method: 'DELETE' });
      loadAdminData();
    }
    loadAdminData();
  </script>
</body>
</html>
